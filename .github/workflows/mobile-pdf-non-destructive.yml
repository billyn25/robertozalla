name: Mobile PDF non destructive

on:
  push:
    paths:
      - '.github/workflows/mobile-pdf-non-destructive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile PDF flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="""      savePdfReturnRecovery();
      doc.save(filename);
      showToast('PDF generado correctamente.');"""
          new="""      // PDF no finaliza ni limpia la hoja. En móvil abrimos una copia aparte
      // para mantener el presupuesto original vivo y editable.
      savePdfReturnRecovery();
      const isMobilePdf = window.matchMedia('(max-width: 760px)').matches || /iP(ad|hone|od)|Android/i.test(navigator.userAgent);
      if (isMobilePdf) {
        const blobUrl = URL.createObjectURL(doc.output('blob'));
        const pdfWindow = window.open(blobUrl, '_blank');
        if (!pdfWindow) doc.save(filename);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 120000);
      } else {
        doc.save(filename);
      }
      showToast('PDF generado correctamente. Puedes volver y seguir editando.');"""
          if old not in s:
              raise SystemExit('PDF save block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Remove temporary workflow
        run: rm .github/workflows/mobile-pdf-non-destructive.yml

      - name: Commit fix
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add app.js .github/workflows/mobile-pdf-non-destructive.yml
          git commit -m "Keep mobile quote editable after PDF"
          git push
