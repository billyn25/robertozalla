name: Fix PDF mobile return

on:
  push:
    paths:
      - '.github/workflows/fix-pdf-return.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-pdf-return.yml
      - name: Commit fix
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add app.js .github/workflows/fix-pdf-return.yml
          git commit -m "Fix mobile PDF return state"
          git push
